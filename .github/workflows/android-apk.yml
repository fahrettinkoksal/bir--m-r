name: Android debug APK

# Amaç: Bir Ömür prototipinin telefona kurulabilir bir test APK'sını üretmek.
# Derleme başarılı olursa APK, workflow artifact olarak indirilebilir hâle gelir.

on:
  # Elle çalıştırma: Actions sekmesi → bu iş akışı → "Run workflow".
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
    # Yalnızca belge değişen gönderimlerde APK yeniden derlenmesin.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Aynı dalda üst üste tetiklenen koşularda eskisini iptal et.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analiz, test ve debug APK
    runs-on: ubuntu-latest
    # **Paket AQ'da 45'ten 60'a çıkarıldı.**
    #
    # Bu satır bir kez 120'ye çıkarılmıştı ve o gerekçe YANLIŞTI. O
    # zaman "süit uzadı, bütçe yetmiyor" denmişti; çünkü iptal olan
    # koşunun logunda tek bir hata yoktu, bütün satırlar yeşildi.
    #
    # Gerçek sebep sonradan ölçüldü: logda 06:19 ile 08:12 arasında
    # **neredeyse iki saat boyunca tek satır çıktı yoktu.** Bu yavaşlık
    # değil, takılmaydı. Üç test sonsuz döngüye giriyordu
    # (`end_to_end_test` senaryo 8, `event_catalog_test` tekrar
    # kalitesi, `health_package_test` hastalık ömrü): hepsi her yıl
    # bekleyen sağlık krizini silip `advanceOneYear`'ı yeniden
    # çağırıyordu, Paket AQ ise sağlık 0 iken yaş almayı durdurduğu
    # için yaş hiç ilerlemiyordu.
    #
    # Dart'ın test zaman aşımı bunu yakalayamaz: senkron bir `while`
    # döngüsü hiç yield etmediği için `Timeout` tetiklenmez. Bu yüzden
    # savunma `test/support/corpus_year.dart` içinde, döngünün kendi
    # ilerleme kontrolünde duruyor — yıl ilerlemezse yüksek sesle
    # patlıyor.
    #
    # Döngüler düzeltildikten sonra o üç dosya + yamalanan iki dosya
    # (100 test) yerelde 31 saniyede bitiyor. Bütçenin 120 kalması bir
    # sonraki takılmayı iki saat saklardı; 45 ise Paket AQ ile gerçekten
    # uzayan hayatlara (ortalama ölüm yaşı 64,5 -> 68,0) pay bırakmıyor.
    # 60, hem pay bırakıyor hem takılmayı erken açığa çıkarıyor.
    timeout-minutes: 60

    defaults:
      run:
        # Flutter projesi deponun kökünde değil, app/ klasöründe.
        working-directory: app

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      # Android Gradle Plugin 8.x, Gradle'ın JDK 17 ile çalışmasını ister.
      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Sürüm bilgisi
        run: |
          flutter --version
          java -version

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

      - name: Debug APK derle
        run: flutter build apk --debug

      - name: APK bilgisi
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/

      - name: APK'yı artifact olarak yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bir-omur-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Derleme patlarsa tanı için ortam bilgisi bırak.
      - name: Hata durumunda ortam bilgisi
        if: failure()
        run: flutter doctor -v
